experiment_name: "OLMoE_profile_shareGPT_uncapped"
model:
  id: "allenai/OLMoE-1B-7B-0924-Instruct"
  precision: "bf16"
  prefer_safetensors: true # Fail fast on repos that only publish legacy .bin weights.
  device: "cuda"

dataset: ../datasets/sharegpt_prompts.json

metrics:
  calculate_small_expert_routing: true
  calculate_expert_routing: false

trace:
  enabled: false
  save_inference_outputs: false

inference:
  max_input_tokens: 3072   # null = no truncation
  max_new_tokens: 256
  use_chat_template: true

profiler:
  enabled: false
